name: AMV Travel - Suite E2E (QA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Que suite correr'
        required: true
        type: choice
        default: 'bloque-a'
        options:
          - bloque-a
          - bloque-b
          - bloque-c
          - webadmin
          - six
          - seguridad
          - nueva
          - todas
      filtro:
        description: 'Opcional: acota dentro de la suite elegida (no aplica a "todas"). Ej: -g "Ofertas"'
        required: false
        default: ''

permissions:
  contents: write

# Cada corrida publica reemplazando la rama gh-pages entera (force_orphan). Si dos
# corridas se solapan, la ultima en publicar pisa lo que subio la otra y se pierde su
# detalle (asi se perdio el de la corrida #152). Con un unico grupo y sin cancelar la
# que esta en curso, las corridas se encolan y publican de a una: nunca se pisan.
concurrency:
  group: tablero-publicacion
  cancel-in-progress: false

# Lo que necesitan los tests en cualquier maquina.
env:
  AMV_BASE_URL: https://qa.amv.travel
  AMV_BO_URL: https://qa.bo.amv.travel
  AMV_USER: ${{ secrets.AMV_USER }}
  AMV_PASS: ${{ secrets.AMV_PASS }}
  BO_USER: ${{ secrets.BO_USER }}
  BO_PASS: ${{ secrets.BO_PASS }}
  AMV_MARKUP_USER: ${{ secrets.AMV_MARKUP_USER }}
  AMV_MARKUP_PASS: ${{ secrets.AMV_MARKUP_PASS }}
  AMV_SIX_AUTOLOGIN_URL: ${{ secrets.AMV_SIX_AUTOLOGIN_URL }}
  AMV_MOV_SUCURSAL_DESTINO: ${{ secrets.AMV_MOV_SUCURSAL_DESTINO }}
  AMV_MOV_CAJA_DESTINO: ${{ secrets.AMV_MOV_CAJA_DESTINO }}
  AMV_MOV_MONEDA_DESTINO: ${{ secrets.AMV_MOV_MONEDA_DESTINO }}

jobs:
  # Un solo bloque (o el push a main, que corre bloque-a): una maquina, como siempre.
  unico:
    if: ${{ (github.event.inputs.suite || 'bloque-a') != 'todas' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/correr
        with:
          carril: ${{ github.event.inputs.suite || 'bloque-a' }}
          filtro: ${{ github.event.inputs.filtro }}

  # La corrida completa, en dos fases de dos maquinas. Todos los bloques usan la misma
  # base de QA, asi que solo corren juntos los que no se pisan los datos (23/10/2026):
  #   - WebAdmin cambia la habitacion 18371, el servicio 7954 y el mercado 37 / agencia
  #     6334, que leen Tarifario, Reservas y SIX: no puede coincidir con ellos.
  #   - Reservas y Cobranzas vacian y usan el carrito de pablo1: no pueden coincidir.
  #   - Tarifario, Seguridad y SIX solo leen.
  # Fase 1: WebAdmin || Cobranzas.  Fase 2: Reservas || Tarifario + Seguridad + SIX.
  fase1:
    if: ${{ github.event.inputs.suite == 'todas' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        carril: [webadmin, cobranzas]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/correr
        with:
          carril: ${{ matrix.carril }}

  fase2:
    needs: fase1
    # Corre aunque la fase 1 tenga tests en rojo: lo que se espera es que termine.
    if: ${{ !cancelled() && github.event.inputs.suite == 'todas' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        carril: [reservas, lectura]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/correr
        with:
          carril: ${{ matrix.carril }}

  # Fase 3: los mismos flujos sobre la app nueva (ClimbsApp), despues de la actual y no
  # al mismo tiempo: usan la misma base de QA. Queda hasta que la app vieja deje de usarse.
  fase3:
    needs: fase2
    if: ${{ !cancelled() && github.event.inputs.suite == 'todas' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/correr
        with:
          carril: nueva

  # Junta los resultados de todas las maquinas y publica una sola vez.
  publicar:
    needs: [unico, fase1, fase2, fase3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cada publicacion reemplaza la rama gh-pages entera (force_orphan, mas abajo),
      # asi que lo publicado antes hay que traerlo para volver a subirlo. Va a
      # ./gh-pages porque es la carpeta que lee el paso de Allure: de ahi copia los
      # reportes anteriores y last-history, que arma la tendencia. Hasta el 2026-09-22
      # no se traia, y cada corrida publicaba solo su propio reporte. El tablero lee
      # sus corridas anteriores de la misma carpeta (gh-pages/tablero).
      # La primera vez la rama no existe y el paso sigue igual.
      - name: Traer lo publicado en GitHub Pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Cada carril subio blob-report/<carril>.zip y sus allure-results: al bajarlos
      # juntos quedan en las mismas dos carpetas (los nombres no se repiten).
      - name: Bajar los resultados de cada maquina
        uses: actions/download-artifact@v4
        with:
          pattern: resultados-*
          merge-multiple: true

      # Un solo JSON para el tablero y un solo HTML, como si hubiera corrido en una maquina.
      - name: Juntar los reportes de Playwright
        run: |
          ls -la blob-report || true
          mkdir -p resultados
          if ls blob-report/*.zip >/dev/null 2>&1; then
            PLAYWRIGHT_JSON_OUTPUT_NAME=resultados/playwright.json npx playwright merge-reports --reporter json ./blob-report
            PLAYWRIGHT_HTML_OPEN=never npx playwright merge-reports --reporter html ./blob-report
          else
            echo "No llego ningun blob: la corrida murio antes de los tests."
          fi
          mkdir -p allure-results

      - name: Subir resultados de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: warn

      # GitHub rechaza cualquier archivo de mas de 100 MB, y las trazas de los tests
      # largos —reservas y cobranzas— llegan a 146 MB: una sola alcanza para que el
      # push del reporte entero sea rechazado ("GH001: Large files detected"), que es
      # lo que dejo sin publicar las corridas 58 a 63. Se sacan del reporte los
      # adjuntos que superan el limite, SIEMPRE DESPUES de subir los resultados como
      # artefacto: ahi siguen disponibles para investigar. Las capturas y los videos
      # no se tocan.
      - name: Sacar del reporte los adjuntos que superan el limite de GitHub
        if: always()
        run: |
          echo "Adjuntos de mas de 90 MB:"
          find allure-results -type f -size +90M -exec du -h {} + || true
          find allure-results -type f -size +90M -delete || true

      # El CLI de Allure necesita Java; en el runner se instala en un paso.
      - name: Configurar Java (para Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Se genera con el CLI de Allure (corre en el runner con el Java ya instalado) en
      # vez de la accion Docker simple-elf/allure-report-action: esa accion es Docker y
      # GitHub la buildea al iniciar el job; cuando el build fallaba (Docker Hub
      # intermitente) tumbaba el job ENTERO antes de correr los tests. El 22/10 asi
      # murieron varias corridas. El tablero NO depende de este paso (lo arma el paso
      # siguiente leyendo gh-pages/tablero), y el fallback deja allure-history creado
      # aunque Allure falle, para que la publicacion siga igual.
      - name: Generar reporte Allure
        if: always()
        run: |
          # Tendencia entre corridas: se restaura el history de lo ya publicado, si esta.
          if [ -d gh-pages/history ]; then mkdir -p allure-results/history && cp -r gh-pages/history/. allure-results/history/ || true; fi
          npx -y -p allure-commandline@2.29.0 allure generate allure-results --clean -o allure-history || mkdir -p allure-history

      # Va DESPUES de generar el Allure: ese paso borra de allure-history todo lo que
      # no sea el numero de una corrida, y se llevaria la carpeta del tablero.
      # Si la corrida murio antes de los tests, igual queda registrada, sin resultados.
      - name: Armar el resumen para el tablero
        if: always()
        env:
          CORRIDA: ${{ github.run_number }}
          CORRIDA_ID: ${{ github.run_id }}
          SUITE: ${{ github.event.inputs.suite || 'bloque-a' }}
          FILTRO: ${{ github.event.inputs.filtro }}
          EVENTO: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        # La pagina y el catalogo salen del repo en cada corrida: un cambio de
        # nombre o de defecto conocido se publica con la corrida siguiente.
        #
        # Se arma en una carpeta propia y se copia con sudo: allure-history la crea
        # el paso de Allure, que corre en Docker como root, y el usuario del runner
        # no puede escribir adentro. Es la causa
        # probable de que este paso fallara en la corrida 69: el log no se pudo leer sin login.
        run: |
          mkdir -p tablero-publicar
          cp tablero/index.html tablero/pruebas.json tablero/favicon.svg tablero-publicar/
          node tools/resumen-corrida.mjs resultados/playwright.json gh-pages/tablero tablero-publicar
          sudo mkdir -p allure-history
          sudo rm -rf allure-history/tablero
          sudo cp -r tablero-publicar allure-history/tablero

      - name: Publicar en GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          # Cada publicacion REEMPLAZA la anterior en vez de sumarse. Sin esto, la
          # rama gh-pages guarda un commit con el reporte entero por cada corrida
          # —capturas de cada paso, videos y trazas— y nada se borra nunca: el repo
          # llego a ~12 GB y GitHub empezo a rechazar el push, asi que desde el
          # 2026-09-16 las corridas 58 a 62 no publicaron. Los reportes de las
          # ultimas corridas siguen publicados: viven dentro de allure-history, que
          # es lo que se sube.
          force_orphan: true
