name: AMV Travel - Suite E2E (QA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Que suite correr'
        required: true
        type: choice
        default: 'bloque-a'
        options:
          - bloque-a
          - bloque-b
          - bloque-c
          - todas
      filtro:
        description: 'Opcional: acota dentro de la suite elegida. Ej: -g "Ofertas"'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # `--with-deps` corre un `apt-get update`, y la imagen de ubuntu-latest trae
      # configurado el repositorio de Google Chrome. Cuando ese indice esta a mitad
      # de publicacion apt corta con "Hash Sum mismatch" y el paso muere con codigo
      # 100 sin instalar nada, aunque la suite corre con el chromium de Playwright y
      # no usa Google Chrome para nada. Se saca esa lista antes de instalar: el
      # runner es efimero y no la necesita.
      #
      # El segundo intento es el cinturon: si apt falla igual por otro motivo, el
      # navegador se instala sin las dependencias del sistema, que en el runner de
      # GitHub ya vienen puestas.
      - name: Instalar navegador
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          npx playwright install --with-deps chromium || npx playwright install chromium

      # En push a main no hay inputs: corre bloque-a, que es el comportamiento
      # que ya tenia el pipeline. La eleccion es para la corrida manual.
      - name: Ejecutar tests
        env:
          AMV_BASE_URL: https://qa.amv.travel
          AMV_BO_URL: https://qa.bo.amv.travel
          AMV_USER: ${{ secrets.AMV_USER }}
          AMV_PASS: ${{ secrets.AMV_PASS }}
          BO_USER: ${{ secrets.BO_USER }}
          BO_PASS: ${{ secrets.BO_PASS }}
          SUITE: ${{ github.event.inputs.suite || 'bloque-a' }}
          FILTRO: ${{ github.event.inputs.filtro }}
        run: |
          case "$SUITE" in
            bloque-a) RUTA="tests/bloque-a" ;;
            bloque-b) RUTA="tests/bloque-b" ;;
            bloque-c) RUTA="tests/bloque-c" ;;
            todas)    RUTA="tests" ;;
            *) echo "Suite desconocida: $SUITE"; exit 1 ;;
          esac
          echo "Corriendo: $RUTA $FILTRO"
          npx playwright test $RUTA $FILTRO

      - name: Subir resultados de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # GitHub rechaza cualquier archivo de mas de 100 MB, y las trazas de los tests
      # largos —reservas y cobranzas— llegan a 146 MB: una sola alcanza para que el
      # push del reporte entero sea rechazado ("GH001: Large files detected"), que es
      # lo que dejo sin publicar las corridas 58 a 63. Se sacan del reporte los
      # adjuntos que superan el limite, SIEMPRE DESPUES de subir los resultados como
      # artefacto: ahi siguen disponibles para investigar. Las capturas y los videos
      # no se tocan.
      - name: Sacar del reporte los adjuntos que superan el limite de GitHub
        if: always()
        run: |
          echo "Adjuntos de mas de 90 MB:"
          find allure-results -type f -size +90M -printf '%s	%p
' | sort -rn || true
          find allure-results -type f -size +90M -delete || true

      # El CLI de Allure necesita Java; en el runner se instala en un paso.
      - name: Configurar Java (para Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar reporte Allure
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          # 5 corridas en el historial: con 20 lo publicado pesaba el cuadruple y
          # nadie mira tan atras.
          keep_histories: 5

      - name: Publicar en GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          # Cada publicacion REEMPLAZA la anterior en vez de sumarse. Sin esto, la
          # rama gh-pages guarda un commit con el reporte entero por cada corrida
          # —capturas de cada paso, videos y trazas— y nada se borra nunca: el repo
          # llego a ~12 GB y GitHub empezo a rechazar el push, asi que desde el
          # 2026-09-16 las corridas 58 a 62 no publicaron. Los reportes de las
          # ultimas corridas siguen publicados: viven dentro de allure-history, que
          # es lo que se sube.
          force_orphan: true
