name: AMV Travel - Suite E2E (QA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sistema:
        description: 'Sistema: el viejo (portal, BO y WebAdmin actuales), el nuevo (ClimbsApp) o los dos'
        required: true
        type: choice
        default: 'Ambos'
        options:
          - Ambos
          - Viejo
          - Nuevo
      area:
        description: 'Area. "Todas" con los dos sistemas es la corrida completa, en tres fases'
        required: true
        type: choice
        default: 'Todas'
        options:
          - Todas
          - Tarifario
          - Reservas
          - Cobranzas
          - WebAdmin
          - SIX
          - Seguridad
      prueba:
        description: 'Una prueba sola (opcional). Tiene que ser del area elegida, o elegir el area "Todas"'
        required: true
        type: choice
        default: '(todas las del area)'
        options:
          # desplegable:desde (lo arma tools/actualizar-desplegable.mjs: no editar a mano)
          - "(todas las del area)"
          - "Tarifario · Cabecera: el contador, los chips de categoria y Limpiar acompanan al listado"
          - "Tarifario · Card: el carrusel trae todas las imagenes del hotel"
          - "Tarifario · Cena Show: trae tarifas y coinciden con las de la base"
          - "Tarifario · Cruceros: trae tarifas y muestra el crucero esperado"
          - "Tarifario · El calendario opera todos los dias que declaran sus reglas"
          - "Tarifario · El contenido del tarifario se muestra en el idioma elegido"
          - "Tarifario · El tarifario muestra hoteles, paquetes y ofertas en el idioma elegido"
          - "Tarifario · Excursiones: trae tarifas y muestra la excursion esperada"
          - "Tarifario · Hoteles: aplica el markup de hoteles del mercado"
          - "Tarifario · Hoteles: trae tarifas y muestra el hotel esperado"
          - "Tarifario · Ofertas: trae tarifas y muestra la oferta esperada"
          - "Tarifario · Paquetes: trae tarifas y muestra el paquete esperado"
          - "Tarifario · Servicios: aplica el markup de servicios del mercado"
          - "Tarifario · Traslados: trae tarifas y muestra el traslado esperado"
          - "Reservas · Carrito y checkout: el servicio se muestra en el idioma elegido"
          - "Reservas · Cena Show: el idioma y el recargo de la ficha llegan iguales al carrito"
          - "Reservas · Checkout: el portal no deja emitir una reserva incompleta"
          - "Reservas · Cotizaciones: la cotizacion de pablo1 se acota por codigo y no se ve ni se abre desde otra agencia"
          - "Reservas · Hotel y servicio en el mismo carrito: cada uno lleva el markup de su tipo"
          - "Reservas · Hotel: la reserva emitida conserva los datos en el BackOffice"
          - "Reservas · Hotel: una reserva emitida se puede cancelar y el portal lo refleja"
          - "Reservas · Multidestino: armado, detalle y carrito se muestran en el idioma elegido"
          - "Reservas · Multidestino: el servicio y el hotel agregados desde los modales quedan con el precio del tarifari…"
          - "Reservas · Multidestino: la cotizacion guardada se descarga y al retomarla conserva el precio hasta el carrito"
          - "Reservas · Multidestino: la reserva emitida conserva los datos en el BackOffice"
          - "Reservas · Multidestino: una reserva emitida se puede cancelar y el portal lo refleja"
          - "Reservas · Oferta: la reserva emitida conserva los datos en el BackOffice"
          - "Reservas · Programa: se busca, se cotiza por habitacion, se reserva y descuenta el cupo de la sa… [solo nuevo]"
          - "Reservas · Reservas: la reserva de pablo1 se acota por codigo y no se ve ni se abre desde otra agencia"
          - "Reservas · Serie: el asistente no deja avanzar con datos incompletos"
          - "Reservas · Serie: la reserva emitida conserva los datos en el BackOffice"
          - "Reservas · Serie: las pantallas se muestran en el idioma elegido"
          - "Reservas · Servicio: dentro de las 72 horas muestra el cartel y no deja agregar; desde hoy + 3 s… [solo viejo]"
          - "Reservas · Servicio: la reserva emitida conserva los datos en el BackOffice"
          - "Reservas · Servicio: una reserva emitida se puede cancelar y el portal lo refleja"
          - "Cobranzas · Alta manual: el servicio agregado a un file queda con el costo, la venta y la moneda esperados, y…"
          - "Cobranzas · Anular la carta de cobranza: sale de Cartas emitidas, el file vuelve a A Facturar y se puede volv…"
          - "Cobranzas · Anular ordenes de pago: la que no tiene imputacion se anula y la imputada sigue vigente"
          - "Cobranzas · Bloqueos: el file con comprobantes no se cancela y el vencimiento invalido se rechaza"
          - "Cobranzas · Caja diaria: recibe el pago y el cobro del mismo file y cuadra"
          - "Cobranzas · Cierre del file: con la cadena completa, el file muestra cada comprobante y queda al dia"
          - "Cobranzas · Cuenta corriente: con la cadena completa, el cliente y el proveedor listan sus comprobantes con i…"
          - "Cobranzas · Detracción: la orden lista la factura por su detracción, la asigna y se aprueba"
          - "Cobranzas · Factura al cliente: se emite sobre el file y toma sus conceptos"
          - "Cobranzas · Factura de proveedor: se carga sobre el file y se imputa al item"
          - "Cobranzas · Liquidacion: se arma desde el file, guarda lo editado y se regenera"
          - "Cobranzas · Movimiento entre dos cajas de la misma sucursal: sale de una, entra en la otra y cuadra"
          - "Cobranzas · Movimiento entre sucursales: la entrada vive en la caja destino, se ve en solo lectura y no se co…"
          - "Cobranzas · No asignados: el item y la factura figuran pendientes y salen al imputar"
          - "Cobranzas · No asignados: la orden de pago aprobada figura sin imputar y sale al imputarla"
          - "Cobranzas · Orden de cobro: cobra el comprobante del cliente en la caja de regresion"
          - "Cobranzas · Orden de pago parcial: el pendiente de la factura baja el monto imputado y no se puede imputar de…"
          - "Cobranzas · Orden de pago: cancela la factura del proveedor desde la caja de regresion"
          - "Cobranzas · Validaciones: el BO rechaza lo que no debe permitir"
          - "WebAdmin · Agencia: el markup propio de servicios gana sobre el del mercado y al vaciarlo vuelve al mercado"
          - "WebAdmin · Con cupo se vende disponible, sin cupo pasa a requerir y despublicada no se ofrece"
          - "WebAdmin · El alta crea el usuario, aparece en el listado, rechaza el email duplicado, entra al portal y se d…"
          - "WebAdmin · El alta sincroniza el contacto, y el pais, el email, el publicado, el estado y la baj… [solo viejo]"
          - "WebAdmin · El cupo, las salidas y las tarifas de una salida se reflejan en el portal"
          - "WebAdmin · Extender el ultimo corte de un solo hotel crea las tarifas hasta la fecha pedida"
          - "WebAdmin · Extender las tarifas de un servicio con incremento crea las del rango y el portal las cobra"
          - "WebAdmin · Extender un corte con incremento crea las tarifas del rango y se puede volver a extender"
          - "WebAdmin · La cotizacion carga el markup de hoteles y el tipo de cambio de la agencia y los conserva al crear…"
          - "WebAdmin · La observacion del periodo y el regimen de la habitacion se ven en el tarifario del portal"
          - "WebAdmin · Las fichas de los datos propios abren todas sus solapas, en claro y en oscuro"
          - "WebAdmin · Lo que se carga en Gestion de Tarifas llega al Tarifario al generarlo y al precio del portal"
          - "WebAdmin · Mercado: cambiar el markup de hoteles mueve solo los precios de hoteles"
          - "WebAdmin · Mercado: el markup Manual de una sucursal mueve solo los precios de sus países y \"Por defecto\" vue…"
          - "WebAdmin · Todas las pantallas del menu abren sin error"
          - "WebAdmin · Un cliente de la agencia AMV no se sincroniza [solo viejo]"
          - "WebAdmin · Un markup por producto cambia el precio del hotel y \"Excluido\" lo deja sin tarifas para la agencia"
          - "WebAdmin · Una cotizacion de grupo se convierte en reserva y llega a la bandeja del BO"
          - "WebAdmin · Una cotizacion manual cambia el precio de lo que esta en pesos y al desactivarla vuelve a la del p…"
          - "SIX · bookingservice/getbookpassengers devuelve los pasajeros (PII) de una reserva sin sesion"
          - "SIX · El rooming (PII) de un file se obtiene por fileid sin sesion"
          - "SIX · El viaje del pasajero se obtiene con solo el GUID, sin sesion (la API no valida la sesion)"
          - "SIX · Pasajero: al pasar a ingles el inicio y el itinerario salen en ingles"
          - "SIX · Pasajero: con el link entra a su viaje y el itinerario trae lo del file"
          - "SIX · Pasajero: con un token adulterado no entra y vuelve al login"
          - "SIX · Pasajero: el voucher se descarga en PDF"
          - "SIX · Pasajero: la opinion del viaje se guarda y al volver se ve lo que dejo"
          - "Seguridad · Despues de cerrar sesion no se vuelve a una pantalla protegida, ni por URL ni con el boton atras"
          - "Seguridad · Las pantallas internas no se abren sin sesion, y el BackOffice tampoco con una agencia"
          - "Seguridad · Un usuario sin sesion no puede ver por URL una reserva"
          - "Seguridad · Una agencia no puede ver por URL el Word de la cotizacion de otra agencia"
          - "Seguridad · Una agencia no puede ver por URL la cotizacion de otra agencia"
          - "Seguridad · Una agencia no puede ver por URL la reserva de otra agencia"
          # desplegable:hasta
      filtro:
        description: 'Avanzado (opcional): texto a buscar en el titulo de los tests, con espacios. Manda sobre la prueba elegida'
        required: false
        default: ''

permissions:
  contents: write

# Cada corrida publica reemplazando la rama gh-pages entera (force_orphan). Si dos
# corridas se solapan, la ultima en publicar pisa lo que subio la otra y se pierde su
# detalle (asi se perdio el de la corrida #152). Con un unico grupo y sin cancelar la
# que esta en curso, las corridas se encolan y publican de a una: nunca se pisan.
concurrency:
  group: tablero-publicacion
  cancel-in-progress: false

# Lo que necesitan los tests en cualquier maquina.
env:
  # El runner esta en UTC: despues de las 21 de Argentina los tests calculaban "hoy" con el dia
  # siguiente y la app (hora argentina) rechazaba esa fecha como futura.
  TZ: America/Argentina/Buenos_Aires
  AMV_BASE_URL: https://qa.amv.travel
  AMV_BO_URL: https://qa.bo.amv.travel
  AMV_USER: ${{ secrets.AMV_USER }}
  AMV_PASS: ${{ secrets.AMV_PASS }}
  BO_USER: ${{ secrets.BO_USER }}
  BO_PASS: ${{ secrets.BO_PASS }}
  AMV_MARKUP_USER: ${{ secrets.AMV_MARKUP_USER }}
  AMV_MARKUP_PASS: ${{ secrets.AMV_MARKUP_PASS }}
  # El usuario de markups del juego B (lo usa el WebAdmin de la app nueva con AMV_JUEGO_DATOS=B).
  AMV_MARKUP_USER_B: ${{ secrets.AMV_MARKUP_USER_B }}
  AMV_MARKUP_PASS_B: ${{ secrets.AMV_MARKUP_PASS_B }}
  # Respaldo: los tests del SIX piden el link vigente al BO (utils/six-link.ts).
  AMV_SIX_AUTOLOGIN_URL: ${{ secrets.AMV_SIX_AUTOLOGIN_URL }}
  AMV_MOV_SUCURSAL_DESTINO: ${{ secrets.AMV_MOV_SUCURSAL_DESTINO }}
  AMV_MOV_CAJA_DESTINO: ${{ secrets.AMV_MOV_CAJA_DESTINO }}
  AMV_MOV_MONEDA_DESTINO: ${{ secrets.AMV_MOV_MONEDA_DESTINO }}

jobs:
  # Lee los desplegables y arma las maquinas de cada fase (ver tools/plan-corrida.mjs: que
  # corre junto y que no). El push a main corre el Tarifario del sistema viejo, como siempre.
  planificar:
    runs-on: ubuntu-latest
    outputs:
      fase1: ${{ steps.plan.outputs.fase1 }}
      fase2: ${{ steps.plan.outputs.fase2 }}
      fase3: ${{ steps.plan.outputs.fase3 }}
      suite: ${{ steps.plan.outputs.suite }}
      filtro: ${{ steps.plan.outputs.filtro }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SISTEMA: ${{ github.event.inputs.sistema || 'Viejo' }}
          AREA: ${{ github.event.inputs.area || 'Tarifario' }}
          PRUEBA: ${{ github.event.inputs.prueba }}
          FILTRO: ${{ github.event.inputs.filtro }}
        run: node tools/plan-corrida.mjs

  # Desde el 26/11/2026 la corrida completa va en una sola fase de cinco maquinas (ver
  # tools/plan-corrida.mjs); fase2 y fase3 quedan para combinaciones que las necesiten.
  # Hasta el 25/11/2026 la app nueva iba entera en una sola maquina despues de la vieja
  # (unos 70 min) y la corrida completa tardaba cerca de 1 h 50.
  fase1:
    needs: planificar
    if: ${{ needs.planificar.outputs.fase1 != '[]' }}
    name: ${{ matrix.carril }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.planificar.outputs.fase1) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/correr
        with:
          carril: ${{ matrix.carril }}
          tandas: ${{ matrix.tandas }}

  fase2:
    needs: [planificar, fase1]
    # Corre aunque la fase anterior tenga tests en rojo: lo que se espera es que termine.
    if: ${{ !cancelled() && needs.planificar.result == 'success' && needs.planificar.outputs.fase2 != '[]' }}
    name: ${{ matrix.carril }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.planificar.outputs.fase2) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/correr
        with:
          carril: ${{ matrix.carril }}
          tandas: ${{ matrix.tandas }}

  fase3:
    needs: [planificar, fase2]
    if: ${{ !cancelled() && needs.planificar.result == 'success' && needs.planificar.outputs.fase3 != '[]' }}
    name: ${{ matrix.carril }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.planificar.outputs.fase3) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/correr
        with:
          carril: ${{ matrix.carril }}
          tandas: ${{ matrix.tandas }}

  # Junta los resultados de todas las maquinas y publica una sola vez.
  publicar:
    needs: [planificar, fase1, fase2, fase3]
    if: ${{ !cancelled() && needs.planificar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cada publicacion reemplaza la rama gh-pages entera (force_orphan, mas abajo),
      # asi que lo publicado antes hay que traerlo para volver a subirlo. Va a
      # ./gh-pages porque es la carpeta que lee el paso de Allure: de ahi copia los
      # reportes anteriores y last-history, que arma la tendencia. Hasta el 2026-09-22
      # no se traia, y cada corrida publicaba solo su propio reporte. El tablero lee
      # sus corridas anteriores de la misma carpeta (gh-pages/tablero).
      # La primera vez la rama no existe y el paso sigue igual.
      - name: Traer lo publicado en GitHub Pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Cada carril subio blob-report/<carril>.zip y sus allure-results: al bajarlos
      # juntos quedan en las mismas dos carpetas (los nombres no se repiten).
      - name: Bajar los resultados de cada maquina
        uses: actions/download-artifact@v4
        with:
          pattern: resultados-*
          merge-multiple: true

      # Un solo JSON para el tablero y un solo HTML, como si hubiera corrido en una maquina.
      - name: Juntar los reportes de Playwright
        run: |
          ls -la blob-report || true
          mkdir -p resultados
          if ls blob-report/*.zip >/dev/null 2>&1; then
            # merge-reports termina con 1 si hay tests en rojo: eso no es una falla de la publicacion
            # (el 26/11/2026 cortaba el paso antes del HTML y dejaba la publicacion en rojo).
            PLAYWRIGHT_JSON_OUTPUT_NAME=resultados/playwright.json npx playwright merge-reports --reporter json ./blob-report || true
            PLAYWRIGHT_HTML_OPEN=never npx playwright merge-reports --reporter html ./blob-report || true
          else
            echo "No llego ningun blob: la corrida murio antes de los tests."
          fi
          mkdir -p allure-results

      - name: Subir resultados de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: warn

      # GitHub rechaza cualquier archivo de mas de 100 MB, y las trazas de los tests
      # largos —reservas y cobranzas— llegan a 146 MB: una sola alcanza para que el
      # push del reporte entero sea rechazado ("GH001: Large files detected"), que es
      # lo que dejo sin publicar las corridas 58 a 63. Se sacan del reporte los
      # adjuntos que superan el limite, SIEMPRE DESPUES de subir los resultados como
      # artefacto: ahi siguen disponibles para investigar. Las capturas y los videos
      # no se tocan.
      #
      # Desde el 26/11/2026 tambien se sacan todas las trazas (.zip de Playwright): el reporte
      # pesaba mas de 4 GB, casi todo trazas, y el push al tablero terminaba en HTTP 500 desde
      # el 25/11. Las trazas siguen en los artefactos resultados-* de cada corrida.
      - name: Sacar del reporte los adjuntos que superan el limite de GitHub
        if: always()
        run: |
          echo "Peso de allure-results antes: $(du -sh allure-results | cut -f1)"
          node -e '
            const fs = require("fs"), path = require("path"), dir = "allure-results";
            let borradas = 0;
            const limpiar = (n) => {
              if (!n || typeof n !== "object") return;
              if (Array.isArray(n.attachments)) n.attachments = n.attachments.filter((a) => {
                const traza = a.type === "application/zip" || /\.zip$/i.test(a.source || "");
                if (traza) { fs.rmSync(path.join(dir, a.source), { force: true }); borradas++; }
                return !traza;
              });
              (n.steps || []).forEach(limpiar);
            };
            for (const f of fs.readdirSync(dir).filter((f) => f.endsWith("-result.json") || f.endsWith("-container.json"))) {
              const r = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
              limpiar(r); (r.befores || []).forEach(limpiar); (r.afters || []).forEach(limpiar);
              fs.writeFileSync(path.join(dir, f), JSON.stringify(r));
            }
            for (const f of fs.readdirSync(dir).filter((f) => /-attachment\.zip$/.test(f))) { fs.rmSync(path.join(dir, f)); borradas++; }
            console.log(`Trazas sacadas del reporte: ${borradas}`);
          ' || true
          echo "Adjuntos de mas de 90 MB:"
          find allure-results -type f -size +90M -exec du -h {} + || true
          find allure-results -type f -size +90M -delete || true
          echo "Peso de allure-results despues: $(du -sh allure-results | cut -f1)"

      # El CLI de Allure necesita Java; en el runner se instala en un paso.
      - name: Configurar Java (para Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Se genera con el CLI de Allure (corre en el runner con el Java ya instalado) en
      # vez de la accion Docker simple-elf/allure-report-action: esa accion es Docker y
      # GitHub la buildea al iniciar el job; cuando el build fallaba (Docker Hub
      # intermitente) tumbaba el job ENTERO antes de correr los tests. El 22/10 asi
      # murieron varias corridas. El tablero NO depende de este paso (lo arma el paso
      # siguiente leyendo gh-pages/tablero), y el fallback deja allure-history creado
      # aunque Allure falle, para que la publicacion siga igual.
      - name: Generar reporte Allure
        if: always()
        run: |
          # Tendencia entre corridas: se restaura el history de lo ya publicado, si esta.
          if [ -d gh-pages/history ]; then mkdir -p allure-results/history && cp -r gh-pages/history/. allure-results/history/ || true; fi
          npx -y -p allure-commandline@2.29.0 allure generate allure-results --clean -o allure-history || mkdir -p allure-history

      # Va DESPUES de generar el Allure: ese paso borra de allure-history todo lo que
      # no sea el numero de una corrida, y se llevaria la carpeta del tablero.
      # Si la corrida murio antes de los tests, igual queda registrada, sin resultados.
      - name: Armar el resumen para el tablero
        if: always()
        env:
          CORRIDA: ${{ github.run_number }}
          CORRIDA_ID: ${{ github.run_id }}
          SUITE: ${{ needs.planificar.outputs.suite }}
          FILTRO: ${{ needs.planificar.outputs.filtro }}
          EVENTO: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        # La pagina y el catalogo salen del repo en cada corrida: un cambio de
        # nombre o de defecto conocido se publica con la corrida siguiente.
        #
        # Se arma en una carpeta propia y se copia con sudo: allure-history la crea
        # el paso de Allure, que corre en Docker como root, y el usuario del runner
        # no puede escribir adentro. Es la causa
        # probable de que este paso fallara en la corrida 69: el log no se pudo leer sin login.
        run: |
          mkdir -p tablero-publicar
          cp tablero/index.html tablero/pruebas.json tablero/favicon.svg tablero-publicar/
          node tools/resumen-corrida.mjs resultados/playwright.json gh-pages/tablero tablero-publicar
          sudo mkdir -p allure-history
          sudo rm -rf allure-history/tablero
          sudo cp -r tablero-publicar allure-history/tablero

      - name: Publicar en GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          # Cada publicacion REEMPLAZA la anterior en vez de sumarse. Sin esto, la
          # rama gh-pages guarda un commit con el reporte entero por cada corrida
          # —capturas de cada paso, videos y trazas— y nada se borra nunca: el repo
          # llego a ~12 GB y GitHub empezo a rechazar el push, asi que desde el
          # 2026-09-16 las corridas 58 a 62 no publicaron. Los reportes de las
          # ultimas corridas siguen publicados: viven dentro de allure-history, que
          # es lo que se sube.
          force_orphan: true
