name: Correr un carril de la suite
description: Prepara el runner, corre un carril (un bloque o un grupo de bloques) y sube sus resultados para que el paso de publicar los junte.

inputs:
  carril:
    description: 'Nombre de la maquina (da nombre al blob y al artefacto de resultados)'
    required: true
  tandas:
    description: 'Texto JSON con las tandas de la maquina, que corren en fila: [{ proyectos ("|" entre proyectos), grep, sin, juego }]. Sus logins y precondiciones corren solos (dependencies)'
    required: true

runs:
  using: composite
  steps:
    - name: Configurar Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependencias
      shell: bash
      run: npm ci

    # Cachea el navegador de Playwright (~/.cache/ms-playwright) entre corridas: sin
    # esto se baja Chromium (~150 MB) en cada una. La clave incluye el hash del
    # package-lock, asi que al cambiar la version de Playwright el cache se invalida y
    # el paso siguiente lo vuelve a bajar.
    - name: Cache del navegador de Playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: ${{ runner.os }}-playwright-

    # `--with-deps` corre un `apt-get update`, y la imagen de ubuntu-latest trae
    # configurado el repositorio de Google Chrome. Cuando ese indice esta a mitad
    # de publicacion apt corta con "Hash Sum mismatch" y el paso muere con codigo
    # 100 sin instalar nada, aunque la suite corre con el chromium de Playwright y
    # no usa Google Chrome para nada. Se saca esa lista antes de instalar: el
    # runner es efimero y no la necesita.
    #
    # El segundo intento es el cinturon: si apt falla igual por otro motivo, el
    # navegador se instala sin las dependencias del sistema, que en el runner de
    # GitHub ya vienen puestas.
    - name: Instalar navegador
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        npx playwright install --with-deps chromium || npx playwright install chromium

    # Las maquinas las arma tools/plan-corrida.mjs (ver el workflow). Cada maquina corre sus
    # tandas en fila, cada una con su propio comando de Playwright y su blob
    # (<maquina>-<n>.zip). PWTEST_BLOB_DO_NOT_REMOVE evita que cada tanda borre los blobs de
    # las anteriores. Una tanda con juego B corre con AMV_JUEGO_DATOS=B (datos AUTO-QA propios,
    # ver tests/climbs/webadmin/datos.ts). Si una tanda falla, las siguientes corren igual y
    # la maquina termina en rojo. Los filtros van entre comillas: hasta el 25/11 se pasaban
    # sueltos y un texto con espacios no encontraba ningun test.
    - name: Ejecutar tests
      shell: bash
      env:
        TANDAS: ${{ inputs.tandas }}
        CARRIL: ${{ inputs.carril }}
        PWTEST_BLOB_DO_NOT_REMOVE: '1'
      run: |
        FALLO=0
        N=0
        while IFS= read -r T; do
          N=$((N + 1))
          IFS='|' read -ra LISTA <<< "$(jq -r '.proyectos' <<< "$T")"
          GREP=$(jq -r '.grep // ""' <<< "$T")
          SIN=$(jq -r '.sin // ""' <<< "$T")
          JUEGO=$(jq -r '.juego // ""' <<< "$T")
          ARGS=()
          for p in "${LISTA[@]}"; do ARGS+=("--project=$p"); done
          if [ -n "$GREP" ]; then ARGS+=("--grep" "$GREP"); fi
          if [ -n "$SIN" ]; then ARGS+=("--grep-invert" "$SIN"); fi
          echo "::group::Maquina $CARRIL, tanda $N: ${LISTA[*]} ${GREP:+(solo: $GREP)} ${SIN:+(sin: $SIN)} ${JUEGO:+(juego $JUEGO)}"
          AMV_JUEGO_DATOS="$JUEGO" PW_CARRIL="$CARRIL-$N" npx playwright test "${ARGS[@]}" < /dev/null || FALLO=1
          echo "::endgroup::"
        done < <(jq -c '.[]' <<< "$TANDAS")
        exit $FALLO

    - name: Subir los resultados del carril
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: resultados-${{ inputs.carril }}
        path: |
          blob-report
          allure-results
        retention-days: 7
        if-no-files-found: warn
